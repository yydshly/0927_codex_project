      <rect x="341" y="294" width="240" height="126" rx="18" fill="#17314b" stroke="#46768d"/><circle cx="381" cy="342" r="24" fill="#69d8e6"/><text x="374" y="350" fill="#081725" font-size="23" font-weight="700">2</text><text x="420" y="350" fill="#f1f7ff" font-size="25" font-weight="700">估算规模</text><text x="363" y="389" fill="#b6c8dc" font-size="18">QPS · 存储 · 带宽</text>
      <rect x="618" y="294" width="240" height="126" rx="18" fill="#17314b" stroke="#46768d"/><circle cx="658" cy="342" r="24" fill="#ffcf70"/><text x="651" y="350" fill="#081725" font-size="23" font-weight="700">3</text><text x="697" y="350" fill="#f1f7ff" font-size="25" font-weight="700">拆解架构</text><text x="640" y="389" fill="#b6c8dc" font-size="18">组件 · 数据流 · 分区</text>
      <rect x="895" y="294" width="240" height="126" rx="18" fill="#17314b" stroke="#46768d"/><circle cx="935" cy="342" r="24" fill="#ffcf70"/><text x="928" y="350" fill="#081725" font-size="23" font-weight="700">4</text><text x="974" y="350" fill="#f1f7ff" font-size="25" font-weight="700">验证取舍</text><text x="917" y="389" fill="#b6c8dc" font-size="18">瓶颈 · 故障 · 一致性</text>
