    <text x="1065" y="120" fill="#b6c8dc" font-size="20">章节</text>
    <text x="64" y="260" fill="#ffcf70" font-size="18" letter-spacing="2">设计问题的四步解法</text>
    <path d="M148 342H1058" stroke="url(#line)" stroke-width="4" stroke-dasharray="7 8"/>
    <g>
