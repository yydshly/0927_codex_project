      <rect x="715" y="513" width="203" height="71" rx="14" fill="#132e47" stroke="#315d7b"/><text x="816" y="557" fill="#e7f4ff">19–25 进阶案例</text>
      <rect x="932" y="513" width="203" height="71" rx="14" fill="#132e47" stroke="#315d7b"/><text x="1034" y="557" fill="#e7f4ff">26–28 交易系统</text>
