    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#69d8e6"/><stop offset="1" stop-color="#ffcf70"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#254164" stroke-width="1" opacity=".4"/></pattern>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="690" rx="28" fill="url(#grid)"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <text x="64" y="77" fill="#68d9e6" font-size="21" letter-spacing="3">SYSTEM DESIGN NOTES / 007</text>
    <text x="64" y="143" fill="#f1f7ff" font-size="49" font-weight="700">从题目到可靠系统</text>
