<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc"><title id="title">ShoreBreak 能力与原理总图</title><desc id="desc">实现流程、视觉能力、使用场景与模型边界。教学整理，非仿真输出。</desc><rect width="1440" height="1180" fill="#f0f6f8"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><rect width="1440" height="176" fill="#102f40"/><text x="48" y="44.0" fill="#83dbde" font-size="18" font-weight="400">009  /  COASTAL RESEARCH</text><text x="48" y="102.0" fill="#ffffff" font-size="34" font-weight="650">ShoreBreak · 破浪、冲滩与水下光学研究</text><text x="48" y="148.0" fill="#d2e5ed" font-size="18" font-weight="400">能力 → 实现原理 → 可见效果 → 使用边界    /    2026-09-27</text><text x="48" y="232.0" fill="#102f40" font-size="28" font-weight="650">3 层 FFT</text><text x="48" y="268.0" fill="#355461" font-size="18" font-weight="400">风浪与表面细节</text><text x="498" y="232.0" fill="#102f40" font-size="28" font-weight="650">3 cm</text><text x="498" y="268.0" fill="#355461" font-size="18" font-weight="400">局部浅水网格约值</text><text x="948" y="232.0" fill="#102f40" font-size="28" font-weight="650">WebGL 2</text><text x="948" y="268.0" fill="#355461" font-size="18" font-weight="400">GPU 计算与绘制</text><text x="48" y="324.0" fill="#102f40" font-size="20" font-weight="600">实现流程  /  点击研究页中的步骤可逐项阅读源码与效果</text><rect x="48" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="70" y="387.0" fill="#08787d" font-size="17" font-weight="600">01  频谱＋事件</text><text x="70" y="432.0" fill="#102f40" font-size="24" font-weight="650">风浪与涌浪</text><text x="70" y="470.0" fill="#355461" font-size="19" font-weight="400">FFT 与波浪日程</text><text x="70" y="511.0" fill="#355461" font-size="17" font-weight="400">既有细碎、丰富的海面纹理，也能组</text><text x="70" y="539.05" fill="#355461" font-size="17" font-weight="400">织强弱不同的来浪。FFT 本身不</text><text x="70" y="567.1" fill="#355461" font-size="17" font-weight="400">负责生成翻卷浪腔。</text><path d="M375 425h10m-5-5 5 5-5 5" fill="none" stroke="#08787d" stroke-width="2"/><rect x="388" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="410" y="387.0" fill="#08787d" font-size="17" font-weight="600">02  参数化几何</text><text x="410" y="432.0" fill="#102f40" font-size="24" font-weight="650">浪峰变陡与翻卷</text><text x="410" y="470.0" fill="#355461" font-size="19" font-weight="400">阶段表＋独立浪唇</text><text x="410" y="511.0" fill="#355461" font-size="17" font-weight="400">能表现高度场无法直接形成的前倾水</text><text x="410" y="539.05" fill="#355461" font-size="17" font-weight="400">幕。破浪形态受参数和日程控制，不</text><text x="410" y="567.1" fill="#355461" font-size="17" font-weight="400">是完整三维流体自行演化出的任意破</text><text x="410" y="595.15" fill="#355461" font-size="17" font-weight="400">浪。</text><path d="M715 425h10m-5-5 5 5-5 5" fill="none" stroke="#08787d" stroke-width="2"/><rect x="728" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="750" y="387.0" fill="#08787d" font-size="17" font-weight="600">03  GPU 数值模拟</text><text x="750" y="432.0" fill="#102f40" font-size="24" font-weight="650">落水与冲滩</text><text x="750" y="470.0" fill="#355461" font-size="19" font-weight="400">水量与动量交接</text><text x="750" y="511.0" fill="#355461" font-size="17" font-weight="400">破浪过后，白水继续沿沙滩移动并退</text><text x="750" y="539.05" fill="#355461" font-size="17" font-weight="400">回。远处使用近似场接续，并非整片</text><text x="750" y="567.1" fill="#355461" font-size="17" font-weight="400">海都按 3 厘米网格计算。</text><path d="M1055 425h10m-5-5 5 5-5 5" fill="none" stroke="#08787d" stroke-width="2"/><rect x="1068" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="1090" y="387.0" fill="#08787d" font-size="17" font-weight="600">04  渲染与效果</text><text x="1090" y="432.0" fill="#102f40" font-size="24" font-weight="650">泡沫与水下光学</text><text x="1090" y="470.0" fill="#355461" font-size="19" font-weight="400">气泡、光线与湿度</text><text x="1090" y="511.0" fill="#355461" font-size="17" font-weight="400">从岸上、水面和水下观察同一段波浪</text><text x="1090" y="539.05" fill="#355461" font-size="17" font-weight="400">时，各层效果尽量衔接。主体海面仍</text><text x="1090" y="567.1" fill="#355461" font-size="17" font-weight="400">是网格，不是整体光线步进的隐式海</text><text x="1090" y="595.15" fill="#355461" font-size="17" font-weight="400">洋。</text><text x="48" y="724.0" fill="#102f40" font-size="26" font-weight="650">能做什么</text><text x="748" y="724.0" fill="#102f40" font-size="26" font-weight="650">怎样使用 / 不能据此推断什么</text><text x="48" y="773.0" fill="#102f40" font-size="20" font-weight="600">多尺度海面</text><text x="48" y="802.0" fill="#355461" font-size="16" font-weight="400">三个 FFT 波谱层为海面增加大尺度起伏、主要风浪和细小法线变化。</text><text x="48" y="837.0" fill="#102f40" font-size="20" font-weight="600">翻卷水幕与浪腔</text><text x="48" y="866.0" fill="#355461" font-size="16" font-weight="400">独立浪唇网格从浪峰抛出，形成前倾水幕和内侧表面，再在落水后淡出。</text><text x="48" y="901.0" fill="#102f40" font-size="20" font-weight="600">白沫、喷溅与回流</text><text x="48" y="930.0" fill="#355461" font-size="16" font-weight="400">破浪冲击驱动泡沫和粒子，并向浅水系统注入水量与动量。</text><text x="48" y="965.0" fill="#102f40" font-size="20" font-weight="600">局部精细冲滩</text><text x="48" y="994.0" fill="#355461" font-size="16" font-weight="400">约 3 厘米的浅水网格随玩家沿岸移动，远处由近似模型接续。</text><text x="748" y="774.0" fill="#355461" font-size="19" font-weight="400">需要翻卷、水幕和落水白沫的展陈、可交互片段或海岸原型。</text><text x="748" y="856.0" fill="#355461" font-size="19" font-weight="400">破浪阶段经过参考画面校准，属于物理启发的参数化模型，不是任意来</text><text x="748" y="887.35" fill="#355461" font-size="19" font-weight="400">浪自动形成的三维破碎。</text><text x="748" y="956.0" fill="#855221" font-size="18" font-weight="400">截图验证与源码确认分开记录；未做统一硬件性能或工程精度测试。</text><path d="M48 1080H1392" stroke="#b5d0dc"/><text x="48" y="1119.0" fill="#355461" font-size="17" font-weight="400">来源：https://github.com/cryptomanavan/ShoreBreak</text><text x="48" y="1152.0" fill="#355461" font-size="16" font-weight="400">研究提交：11c8c057db67  ·  原站截图归属上游作者  ·  本图为教学整理</text></g></svg>