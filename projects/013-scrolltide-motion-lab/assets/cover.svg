<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Motion Atlas 六种动态网页技术路线</title><desc id="desc">深蓝色展厅海报展示视频、图片序列、实时三维、混合叠层、CSS 3D 和 Shader 六种实现方式。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1720"/><stop offset="1" stop-color="#152e38"/></linearGradient><linearGradient id="ring" x2="1" y2="1"><stop stop-color="#e2f8a5"/><stop offset=".5" stop-color="#72c4d2"/><stop offset="1" stop-color="#2d596d"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#1c3844"/><stop offset="1" stop-color="#0d1a24"/></linearGradient><pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#b7e5d0" stroke-opacity=".07"/></pattern></defs>
<rect width="1440" height="820" fill="url(#bg)"/><rect width="1440" height="820" fill="url(#grid)"/><circle cx="1110" cy="190" r="335" fill="none" stroke="#9ce6d0" stroke-opacity=".18"/><circle cx="1110" cy="190" r="255" fill="none" stroke="#9ce6d0" stroke-opacity=".15"/><ellipse cx="1110" cy="190" rx="270" ry="75" transform="rotate(-28 1110 190)" fill="none" stroke="#d8fba7" stroke-opacity=".35" stroke-width="2"/>
<text x="80" y="90" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#dafa9e">013 / WEB MOTION FIELD GUIDE</text><text x="80" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="74" font-weight="700" letter-spacing="-3" fill="#edf5ef">同样会动，</text><text x="80" y="280" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="74" font-weight="700" letter-spacing="-3" fill="#dafa9e">底层大不相同。</text><text x="83" y="330" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#a7c2c2">六种原创、可操作的网页动效实现样例</text>
<g font-family="Arial,'Microsoft YaHei',sans-serif"><g transform="translate(80 410)"><rect width="403" height="145" rx="9" fill="url(#card)" stroke="#55757a"/><text x="22" y="35" font-size="15" fill="#a9c9c6">01 / MEDIA</text><text x="22" y="80" font-size="28" font-weight="700" fill="#f3f6ed">视频播放</text><text x="22" y="113" font-size="16" fill="#a2b9ba">时间 → 预录像素</text><circle cx="339" cy="72" r="37" fill="#d8ae87" fill-opacity=".13"/><path d="m327 51 36 21-36 21z" fill="#e4c6a2"/></g><g transform="translate(518 410)"><rect width="403" height="145" rx="9" fill="url(#card)" stroke="#55757a"/><text x="22" y="35" font-size="15" fill="#a9c9c6">02 / CANVAS</text><text x="22" y="80" font-size="28" font-weight="700" fill="#f3f6ed">图片序列</text><text x="22" y="113" font-size="16" fill="#a2b9ba">进度 → 预渲染帧</text><ellipse cx="337" cy="73" rx="40" ry="54" fill="none" stroke="url(#ring)" stroke-width="17"/></g><g transform="translate(956 410)"><rect width="403" height="145" rx="9" fill="url(#card)" stroke="#55757a"/><text x="22" y="35" font-size="15" fill="#a9c9c6">03 / WEBGL</text><text x="22" y="80" font-size="28" font-weight="700" fill="#f3f6ed">实时三维</text><text x="22" y="113" font-size="16" fill="#a2b9ba">模型 + 光照 → 像素</text><path d="m337 22 45 50-45 52-43-52z" fill="none" stroke="#b9e8d0" stroke-width="3"/><path d="m294 72 88 0M337 22v102" stroke="#b9e8d0" opacity=".6"/></g>
<g transform="translate(80 585)"><rect width="403" height="145" rx="9" fill="url(#card)" stroke="#55757a"/><text x="22" y="35" font-size="15" fill="#a9c9c6">04 / COMPOSITE</text><text x="22" y="80" font-size="28" font-weight="700" fill="#f3f6ed">混合叠层</text><text x="22" y="113" font-size="16" fill="#a2b9ba">视频 + 实时三维</text><circle cx="326" cy="66" r="34" fill="none" stroke="#8ec7cf" stroke-width="3"/><circle cx="347" cy="81" r="34" fill="none" stroke="#dafa9e" stroke-width="3"/></g><g transform="translate(518 585)"><rect width="403" height="145" rx="9" fill="url(#card)" stroke="#55757a"/><text x="22" y="35" font-size="15" fill="#a9c9c6">05 / DOM</text><text x="22" y="80" font-size="28" font-weight="700" fill="#f3f6ed">CSS 3D</text><text x="22" y="113" font-size="16" fill="#a2b9ba">元素 + 透视变换</text><path d="m317 31 52 9-12 78-51-11z" fill="none" stroke="#a6d9d3" stroke-width="3"/><path d="m331 23 53 14-14 76" fill="none" stroke="#dafa9e" stroke-width="3"/></g><g transform="translate(956 585)"><rect width="403" height="145" rx="9" fill="url(#card)" stroke="#55757a"/><text x="22" y="35" font-size="15" fill="#a9c9c6">06 / GLSL</text><text x="22" y="80" font-size="28" font-weight="700" fill="#f3f6ed">WebGL Shader</text><text x="22" y="113" font-size="16" fill="#a2b9ba">公式 → 每个像素</text><path d="M330 25v93m-47-47h93m-80-32 67 64m0-64-67 64" stroke="#b4e2cf" stroke-width="3"/><circle cx="330" cy="71" r="14" fill="#dafa9e"/></g></g>
<text x="80" y="783" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#92aeb2">MOTION ATLAS · ORIGINAL TECHNIQUE STUDIES</text>
</svg>
