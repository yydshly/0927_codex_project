<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CUDA WebShader 能力与效果展厅</title>
  <desc id="desc">研究总图：CUDA C 子集经编译器转为 WGSL，在 WebGPU 运行；展示五类效果和五十个上游样例入口。图形为分类示意，并非实际运行截图。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091b27"/><stop offset="1" stop-color="#0b111f"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#0c4658"/><stop offset="1" stop-color="#153344"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="0"><stop stop-color="#89ebd5"/><stop offset="1" stop-color="#c4f4b3"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#95c4ce" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <circle cx="1090" cy="300" r="220" fill="#2b8d94" opacity=".12" filter="url(#glow)"/>
  <g font-family="Inter,Segoe UI,Microsoft YaHei,sans-serif">
    <text x="72" y="84" font-size="20" font-weight="700" letter-spacing="5" fill="#77dfd0">011 / OPEN SOURCE RESEARCH</text>
    <text x="72" y="170" font-size="62" font-weight="750" fill="#eef8f7">CUDA WebShader</text>
    <text x="72" y="232" font-size="36" font-weight="650" fill="#a8ebd8">能力与效果展厅</text>
    <text x="72" y="286" font-size="22" fill="#a8c8d0">一份受支持的 CUDA 核函数，进入浏览器 GPU 的计算与画面。</text>
    <g transform="translate(72 344)">
      <rect width="740" height="184" rx="14" fill="#12303c" stroke="#579eaa" stroke-opacity=".58"/>
      <text x="26" y="33" font-size="15" font-weight="700" letter-spacing="3" fill="#7fdacb">SOURCE → SHADER → GPU</text>
      <g font-size="25" font-weight="650">
        <rect x="26" y="57" width="186" height="96" rx="10" fill="#14505a" stroke="#6dd7c9"/>
        <text x="48" y="108" fill="#e7fff6">CUDA C 子集</text>
        <text x="242" y="112" fill="#90dacf">→</text>
        <rect x="291" y="57" width="176" height="96" rx="10" fill="#1c4058" stroke="#77c4dd"/>
        <text x="330" y="108" fill="#e7fff6">WGSL</text>
        <text x="492" y="112" fill="#90dacf">→</text>
        <rect x="543" y="57" width="170" height="96" rx="10" fill="#3d472f" stroke="#c1d288"/>
        <text x="564" y="108" fill="#e7fff6">WebGPU</text>
      </g>
    </g>
    <g transform="translate(72 556)">
      <text y="35" font-size="55" font-weight="750" fill="url(#mint)">50</text>
      <text x="92" y="31" font-size="19" fill="#c5dadd">上游可运行样例入口</text>
      <text x="92" y="59" font-size="17" fill="#83a6b1">按需预览 · 搜索与分类 · 原生对照证据</text>
    </g>
    <g transform="translate(866 117)">
      <rect width="500" height="584" rx="20" fill="#0d2230" stroke="#59899b" stroke-opacity=".5"/>
      <text x="30" y="46" font-size="17" font-weight="700" letter-spacing="3" fill="#82d5c8">EFFECT FAMILIES / 05</text>
      <g font-size="21" fill="#e6f6f0" font-weight="600">
        <rect x="28" y="74" width="444" height="86" rx="10" fill="url(#blue)"/>
        <path d="M51 130Q76 94 102 125T155 113T211 129T270 113" stroke="#8af0dc" stroke-width="4" fill="none"/>
        <text x="303" y="124">动态物理</text>
        <rect x="28" y="175" width="444" height="86" rx="10" fill="#242e52"/>
        <path d="M86 197 124 217 124 242 86 260 49 242 49 217Z" fill="none" stroke="#b4b5f2" stroke-width="3"/>
        <path d="M49 217 86 235 124 217M86 235v25" stroke="#b4b5f2" stroke-width="2" fill="none"/>
        <text x="303" y="225">三维与体数据</text>
        <rect x="28" y="276" width="444" height="86" rx="10" fill="#4c3540"/>
        <rect x="49" y="294" width="74" height="52" rx="4" fill="#d79681"/>
        <path d="M49 323h74M73 294v52M98 294v52" stroke="#ffe2c4" stroke-width="2"/>
        <text x="303" y="326">图像与纹理</text>
        <rect x="28" y="377" width="444" height="86" rx="10" fill="#354834"/>
        <text x="55" y="430" font-size="46" fill="#cfebb7" font-weight="400">∑</text>
        <text x="303" y="427">数值与信号</text>
        <rect x="28" y="478" width="444" height="76" rx="10" fill="#224256"/>
        <path d="M55 533 87 493 125 533 89 519Z" fill="none" stroke="#9fcff3" stroke-width="3"/>
        <text x="303" y="525">几何与渲染</text>
      </g>
    </g>
    <path d="M72 772H1368" stroke="#5e8794" stroke-opacity=".55"/>
    <text x="72" y="809" font-size="18" fill="#bdced3">可见效果：FFT 海洋 · 交互流体 · 粒子碰撞 · 光流 · 网格提取 · 路径追踪 · 图像滤波</text>
    <text x="72" y="851" font-size="15" fill="#7e9dab">研究导览图 / 非上游截图。真实效果请进入对应样例运行。</text>
  </g>
</svg>
