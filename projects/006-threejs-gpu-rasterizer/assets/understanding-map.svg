<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1700" viewBox="0 0 2000 1700" role="img" aria-labelledby="title desc">
  <title id="title">Three.js 与 GPU 驱动渲染实验理解总图</title>
  <desc id="desc">区分 three.js 基础库、官方示例与 PR 33605，概括三维能力、GPU 驱动光栅化五步原理、适用场景、产品价值和边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061722"/><stop offset=".55" stop-color="#0b2734"/><stop offset="1" stop-color="#071a27"/></linearGradient>
    <linearGradient id="tealBar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#77e7d0"/><stop offset="1" stop-color="#b0f4da"/></linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffbd87"/><stop offset="1" stop-color="#ffe3a2"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#91cfc4" stroke-opacity=".055" stroke-width="1"/></pattern>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#ebf5f0}
      .over{font-size:21px;font-weight:700;letter-spacing:3px;fill:#8be8d5}
      .title{font-size:70px;font-weight:700;letter-spacing:-2px}
      .sub{font-size:27px;fill:#bbd0cf}
      .section{font-size:34px;font-weight:700}
      .label{font-size:21px;fill:#8fdcca;font-weight:700;letter-spacing:2px}
      .labelOrange{font-size:21px;fill:#ffca9c;font-weight:700;letter-spacing:2px}
      .cardTitle{font-size:27px;font-weight:700}
      .body{font-size:22px;fill:#bdd1d0}
      .small{font-size:19px;fill:#a9c1c1}
      .flowTitle{font-size:26px;font-weight:700}
      .flowBody{font-size:21px;fill:#c2d2d0}
      .pill{font-size:18px;font-weight:700}
      .num{font-size:19px;font-weight:700;fill:#0b2a34}
    </style>
  </defs>
  <rect width="2000" height="1700" fill="url(#bg)"/>
  <rect width="2000" height="1700" fill="url(#grid)"/>
  <circle cx="1750" cy="100" r="380" fill="#2eaa9b" opacity=".055"/>

  <g transform="translate(72 74)">
    <rect width="96" height="42" rx="4" fill="#83f0d8"/><text x="48" y="29" text-anchor="middle" class="num">006</text>
    <text x="122" y="28" class="over">RESEARCH MAP / 技术与产品理解总图</text>
    <text x="0" y="112" class="title">从 Three.js 到 GPU 驱动渲染</text>
    <text x="2" y="155" class="sub">基础库能做什么 · PR 增加了什么 · 何时有价值</text>
  </g>

  <g>
    <rect x="72" y="260" width="572" height="154" rx="14" fill="#123b45" stroke="#5fafa5" stroke-width="2"/>
    <rect x="72" y="260" width="572" height="8" rx="4" fill="url(#tealBar)"/>
    <text x="101" y="305" class="label">基础层 / SOURCE LIBRARY</text>
    <text x="101" y="349" class="cardTitle">three.js：网页三维基础库</text>
    <text x="101" y="383" class="small">场景 · 相机 · 几何 · 材质 · 灯光 · 渲染</text>
    <path d="M653 337h54m-13-12 13 12-13 12" fill="none" stroke="#8fdfce" stroke-width="3"/>

    <rect x="714" y="260" width="572" height="154" rx="14" fill="#1a4044" stroke="#87b4a0" stroke-width="2"/>
    <rect x="714" y="260" width="572" height="8" rx="4" fill="#d4e58d"/>
    <text x="743" y="305" class="label">参考层 / EXAMPLES &amp; ADDONS</text>
    <text x="743" y="349" class="cardTitle">官方示例：能力与实现样本</text>
    <text x="743" y="383" class="small">可看效果、读代码；不是现成业务产品</text>
    <path d="M1295 337h54m-13-12 13 12-13 12" fill="none" stroke="#e2d69a" stroke-width="3"/>

    <rect x="1356" y="260" width="572" height="154" rx="14" fill="#413036" stroke="#d99576" stroke-width="2"/>
    <rect x="1356" y="260" width="572" height="8" rx="4" fill="url(#orangeBar)"/>
    <text x="1385" y="305" class="labelOrange">研究层 / PR #33605</text>
    <text x="1385" y="349" class="cardTitle">GPU 驱动光栅化实验</text>
    <text x="1385" y="383" class="small">three.js 仓库中的示例，非独立效果库</text>
  </g>

  <g>
    <rect x="72" y="458" width="874" height="657" rx="17" fill="#0d2936" stroke="#376570" stroke-width="2"/>
    <text x="105" y="508" class="label">01 / THREE.JS CAPABILITIES</text>
    <text x="105" y="552" class="section">基础库能让你做出什么？</text>

    <g>
      <rect x="104" y="582" width="392" height="145" rx="10" fill="#163842"/>
      <text x="126" y="616" class="label">01 / 模型与场景</text>
      <text x="126" y="655" class="body">加载产品、设备、建筑模型</text>
      <text x="126" y="687" class="small">组合相机、材质、纹理和灯光</text>
      <rect x="522" y="582" width="392" height="145" rx="10" fill="#163842"/>
      <text x="544" y="616" class="label">02 / 空间交互</text>
      <text x="544" y="655" class="body">旋转、缩放、点击选中对象</text>
      <text x="544" y="687" class="small">联动详情、状态和业务操作</text>
    </g>
    <g>
      <rect x="104" y="744" width="392" height="145" rx="10" fill="#163842"/>
      <text x="126" y="778" class="label">03 / 运动与状态</text>
      <text x="126" y="817" class="body">播放设备和人物动作</text>
      <text x="126" y="849" class="small">骨骼、表情与动画过渡</text>
      <rect x="522" y="744" width="392" height="145" rx="10" fill="#163842"/>
      <text x="544" y="778" class="label">04 / 视觉表现</text>
      <text x="544" y="817" class="body">材质、光影和画面效果</text>
      <text x="544" y="849" class="small">后期辉光等能力可用扩展</text>
    </g>
    <g>
      <rect x="104" y="906" width="392" height="145" rx="10" fill="#163842"/>
      <text x="126" y="940" class="label">05 / 规模控制</text>
      <text x="126" y="979" class="body">实例化、LOD、视野剔除</text>
      <text x="126" y="1011" class="small">让重复物体与远景更可控</text>
      <rect x="522" y="906" width="392" height="145" rx="10" fill="#163842"/>
      <text x="544" y="940" class="label">06 / 新型体验</text>
      <text x="544" y="979" class="body">WebXR 沉浸式浏览</text>
      <text x="544" y="1011" class="small">WebGPU / TSL 探索 GPU 计算</text>
    </g>
    <text x="105" y="1090" class="small">边界：模型制作、业务后台、告警规则与真实物理仿真仍需其他系统。</text>
  </g>

  <g>
    <rect x="970" y="458" width="958" height="657" rx="17" fill="#222b35" stroke="#855f5c" stroke-width="2"/>
    <text x="1004" y="508" class="labelOrange">02 / PR #33605 RENDERING PIPELINE</text>
    <text x="1004" y="552" class="section">它额外研究：一帧里怎么少做无用功？</text>

    <path d="M1030 614V967" stroke="#996d61" stroke-width="3" stroke-dasharray="7 9"/>
    <g>
      <circle cx="1030" cy="617" r="20" fill="#ffc596"/><text x="1030" y="624" class="num" text-anchor="middle">1</text>
      <text x="1070" y="619" class="flowTitle">准备几何</text><text x="1338" y="619" class="flowBody">多档精度、三角形小组和包围体</text>
      <circle cx="1030" cy="697" r="20" fill="#ffc596"/><text x="1030" y="704" class="num" text-anchor="middle">2</text>
      <text x="1070" y="699" class="flowTitle">GPU 筛选</text><text x="1338" y="699" class="flowBody">排除镜头外，按屏幕误差选精度</text>
      <circle cx="1030" cy="777" r="20" fill="#ffc596"/><text x="1030" y="784" class="num" text-anchor="middle">3</text>
      <text x="1070" y="779" class="flowTitle">GPU 排任务</text><text x="1338" y="779" class="flowBody">组织可见队列与间接执行参数</text>
      <circle cx="1030" cy="857" r="20" fill="#ffc596"/><text x="1030" y="864" class="num" text-anchor="middle">4</text>
      <text x="1070" y="859" class="flowTitle">分流绘制</text><text x="1338" y="852" class="flowBody">小三角形：GPU 软件光栅化</text><text x="1338" y="883" class="flowBody">大三角形：硬件光栅化</text>
      <circle cx="1030" cy="957" r="20" fill="#ffc596"/><text x="1030" y="964" class="num" text-anchor="middle">5</text>
      <text x="1070" y="959" class="flowTitle">只给可见像素上色</text><text x="1400" y="959" class="flowBody">记录可见性和深度，再采样</text>
    </g>
    <rect x="1004" y="995" width="890" height="111" rx="9" fill="#493b3b"/>
    <text x="1027" y="1035" class="pill" fill="#ffe4ba">研究价值</text>
    <text x="1141" y="1035" class="flowBody">更细粒度地分配海量几何的绘制工作</text>
    <text x="1027" y="1065" class="small">仍是实验示例：不是自动生成 LOD、任意 GLB/BIM 一键加速的接口。</text>
    <text x="1027" y="1094" class="small">“十亿三角形”指源场景规模，不等于每帧实际绘制的数量。</text>
  </g>

  <g>
    <text x="72" y="1173" class="label">03 / WHERE IT FITS</text>
    <text x="72" y="1216" class="section">适用场景：先用 three.js 构建，再按规模决定是否研究 PR</text>
    <g>
      <rect x="72" y="1242" width="440" height="176" rx="12" fill="#123a43" stroke="#3b6b70"/>
      <text x="98" y="1277" class="label">基础库即可</text><text x="98" y="1319" class="cardTitle">产品展示 / 教学</text>
      <text x="98" y="1353" class="small">查看模型、切换材质、点选部件</text>
      <text x="98" y="1387" class="small">模型较轻时无需引入 PR 架构</text>

      <rect x="544" y="1242" width="440" height="176" rx="12" fill="#24343c" stroke="#87695f"/>
      <text x="570" y="1277" class="labelOrange">大场景可评估 PR</text><text x="570" y="1319" class="cardTitle">工厂 / 风电场巡检</text>
      <text x="570" y="1353" class="small">全场态势 → 告警定位 → 近景检查</text>
      <text x="570" y="1387" class="small">减少远处与镜头外设备负担</text>

      <rect x="1016" y="1242" width="440" height="176" rx="12" fill="#24343c" stroke="#87695f"/>
      <text x="1042" y="1277" class="labelOrange">大场景可评估 PR</text><text x="1042" y="1319" class="cardTitle">BIM / 大型工程</text>
      <text x="1042" y="1353" class="small">楼层浏览 → 构件或管线审阅</text>
      <text x="1042" y="1387" class="small">按视角分配海量细小几何</text>

      <rect x="1488" y="1242" width="440" height="176" rx="12" fill="#24343c" stroke="#87695f"/>
      <text x="1514" y="1277" class="labelOrange">大场景可评估 PR</text><text x="1514" y="1319" class="cardTitle">城市 / 扫描资产</text>
      <text x="1514" y="1353" class="small">全景漫游 → 靠近建筑或文物</text>
      <text x="1514" y="1387" class="small">远景简化，近景保留可见细节</text>
    </g>
  </g>

  <g>
    <rect x="72" y="1454" width="1856" height="169" rx="13" fill="#14505a" stroke="#5da69e" stroke-width="2"/>
    <text x="102" y="1490" class="label">04 / WHAT THIS MEANS FOR YOU</text>
    <text x="102" y="1533" class="cardTitle">你的落地路径</text>
    <text x="102" y="1572" class="body">① 看官方示例验证效果</text>
    <path d="M533 1565h60m-13-12 13 12-13 12" fill="none" stroke="#b9eecf" stroke-width="3"/>
    <text x="620" y="1572" class="body">② 接入模型与业务数据做原型</text>
    <path d="M1185 1565h60m-13-12 13 12-13 12" fill="none" stroke="#b9eecf" stroke-width="3"/>
    <text x="1271" y="1572" class="body">③ 测帧时间后决定优化深度</text>
    <text x="102" y="1602" class="small">three.js 是三维产品底座；PR 给出一种极大场景的研究路线。真实收益必须用你的模型和设备测试。</text>
  </g>

  <text x="72" y="1662" class="small">资料：threejs.org/manual · threejs.org/examples · github.com/mrdoob/three.js/pull/33605</text>
  <text x="1928" y="1662" class="small" text-anchor="end">FIELD/FRAME · 教学汇总图 · 非性能基准</text>
</svg>
