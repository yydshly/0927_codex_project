<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc"><title id="title">coastal-simulation 能力与原理总图</title><desc id="desc">实现流程、视觉能力、使用场景与模型边界。教学整理，非仿真输出。</desc><rect width="1440" height="1180" fill="#f0f6f8"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><rect width="1440" height="176" fill="#102f40"/><text x="48" y="44.0" fill="#83dbde" font-size="18" font-weight="400">008  /  COASTAL RESEARCH</text><text x="48" y="102.0" fill="#ffffff" font-size="34" font-weight="650">coastal-simulation · 海岸浅水、泡沫与湿沙研究</text><text x="48" y="148.0" fill="#d2e5ed" font-size="18" font-weight="400">能力 → 实现原理 → 可见效果 → 使用边界    /    2026-09-27</text><text x="48" y="232.0" fill="#102f40" font-size="28" font-weight="650">30 cm</text><text x="48" y="268.0" fill="#355461" font-size="18" font-weight="400">浅水网格间距</text><text x="498" y="232.0" fill="#102f40" font-size="28" font-weight="650">72 × 120 m</text><text x="498" y="268.0" fill="#355461" font-size="18" font-weight="400">固定模拟范围约值</text><text x="948" y="232.0" fill="#102f40" font-size="28" font-weight="650">CPU + Wasm</text><text x="948" y="268.0" fill="#355461" font-size="18" font-weight="400">流体计算路径</text><text x="48" y="324.0" fill="#102f40" font-size="20" font-weight="600">实现流程  /  点击研究页中的步骤可逐项阅读源码与效果</text><rect x="48" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="70" y="387.0" fill="#08787d" font-size="17" font-weight="600">01  解析模型</text><text x="70" y="432.0" fill="#102f40" font-size="24" font-weight="650">外海波浪输入</text><text x="70" y="470.0" fill="#355461" font-size="19" font-weight="400">四组波叠加</text><text x="70" y="511.0" fill="#355461" font-size="17" font-weight="400">浪不会很快重复成同一个短循环；调</text><text x="70" y="539.05" fill="#355461" font-size="17" font-weight="400">整浪强、潮位后，近岸水体逐渐响应</text><text x="70" y="567.1" fill="#355461" font-size="17" font-weight="400">。</text><path d="M375 425h10m-5-5 5 5-5 5" fill="none" stroke="#08787d" stroke-width="2"/><rect x="388" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="410" y="387.0" fill="#08787d" font-size="17" font-weight="600">02  数值模拟</text><text x="410" y="432.0" fill="#102f40" font-size="24" font-weight="650">计算浅水流动</text><text x="410" y="470.0" fill="#355461" font-size="19" font-weight="400">水深与水平流速</text><text x="410" y="511.0" fill="#355461" font-size="17" font-weight="400">水能沿坡面冲滩、退水和绕石流动。</text><text x="410" y="539.05" fill="#355461" font-size="17" font-weight="400">海床固定，不包含沙滩侵蚀或泥沙地</text><text x="410" y="567.1" fill="#355461" font-size="17" font-weight="400">形变化。</text><path d="M715 425h10m-5-5 5 5-5 5" fill="none" stroke="#08787d" stroke-width="2"/><rect x="728" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="750" y="387.0" fill="#08787d" font-size="17" font-weight="600">03  状态更新</text><text x="750" y="432.0" fill="#102f40" font-size="24" font-weight="650">输运泡沫与湿度</text><text x="750" y="470.0" fill="#355461" font-size="19" font-weight="400">白沫、湿沙、水膜</text><text x="750" y="511.0" fill="#355461" font-size="17" font-weight="400">白沫会移动和变薄；水退去后，沙滩</text><text x="750" y="539.05" fill="#355461" font-size="17" font-weight="400">仍可保持暗色与短暂反光。</text><path d="M1055 425h10m-5-5 5 5-5 5" fill="none" stroke="#08787d" stroke-width="2"/><rect x="1068" y="350" width="324" height="318" rx="12" fill="white" stroke="#c6dce5"/><text x="1090" y="387.0" fill="#08787d" font-size="17" font-weight="600">04  图形渲染</text><text x="1090" y="432.0" fill="#102f40" font-size="24" font-weight="650">重建与绘制水面</text><text x="1090" y="470.0" fill="#355461" font-size="19" font-weight="400">高度场与水的光学</text><text x="1090" y="511.0" fill="#355461" font-size="17" font-weight="400">表现清浅海水与连贯的移动岸线。主</text><text x="1090" y="539.05" fill="#355461" font-size="17" font-weight="400">体水面每个水平位置只有一个高度，</text><text x="1090" y="567.1" fill="#355461" font-size="17" font-weight="400">无法直接形成翻卷水幕的空气腔。</text><text x="48" y="724.0" fill="#102f40" font-size="26" font-weight="650">能做什么</text><text x="748" y="724.0" fill="#102f40" font-size="26" font-weight="650">怎样使用 / 不能据此推断什么</text><text x="48" y="773.0" fill="#102f40" font-size="20" font-weight="600">浪涌与冲滩</text><text x="48" y="802.0" fill="#355461" font-size="16" font-weight="400">外海波动驱动近岸水体，水沿坡面上冲、退回，岸线随水位移动。</text><text x="48" y="837.0" fill="#102f40" font-size="20" font-weight="600">岩石与水流</text><text x="48" y="866.0" fill="#355461" font-size="16" font-weight="400">岩石同时进入可见场景和水力地形，水流会被阻挡；低处可以被越过。</text><text x="48" y="901.0" fill="#102f40" font-size="20" font-weight="600">随流泡沫</text><text x="48" y="930.0" fill="#355461" font-size="16" font-weight="400">根据水面陡度、流动压缩和撞击生成白沫，记录新旧泡沫并让纹理随水流移动。</text><text x="48" y="965.0" fill="#102f40" font-size="20" font-weight="600">湿沙与水膜</text><text x="48" y="994.0" fill="#355461" font-size="16" font-weight="400">水膜较快消退，吸收的湿度较慢衰减，形成退水后的反光与深色痕迹。</text><text x="748" y="774.0" fill="#355461" font-size="19" font-weight="400">沿着输入、流动、输运、渲染四步阅读代码，理解每一层如何影响画面</text><text x="748" y="805.35" fill="#355461" font-size="19" font-weight="400">。</text><text x="748" y="856.0" fill="#355461" font-size="19" font-weight="400">主体是二维平面上的水深与水平速度，属于高度场；没有完整三维流体</text><text x="748" y="887.35" fill="#355461" font-size="19" font-weight="400">体积。</text><text x="748" y="956.0" fill="#855221" font-size="18" font-weight="400">截图验证与源码确认分开记录；未做统一硬件性能或工程精度测试。</text><path d="M48 1080H1392" stroke="#b5d0dc"/><text x="48" y="1119.0" fill="#355461" font-size="17" font-weight="400">来源：https://github.com/iamtechartist/coastal-simulation</text><text x="48" y="1152.0" fill="#355461" font-size="16" font-weight="400">研究提交：2e95e1a3e757  ·  原站截图归属上游作者  ·  本图为教学整理</text></g></svg>