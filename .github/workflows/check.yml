name: Check project index

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate project metadata and README index
        run: python3 scripts/projects.py check
      - name: Check reference-source validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build Xi'an Night Atlas
        working-directory: projects/001-xian-night-atlas/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Check FreeMoCap lab
        run: |
          node --check projects/002-freemocap-lab/web/src/app.mjs
          npm --prefix projects/002-freemocap-lab/web test
          npm --prefix projects/002-freemocap-lab/web run build
      - name: Check Lofi Cities desktop product
        run: |
          npm --prefix projects/003-lofi-cities/web run check
          npm --prefix projects/003-lofi-cities/web test
      - name: Check Jailbreaks research guide
        run: |
          npm --prefix projects/005-jailbreaks-research/web run check
          npm --prefix projects/005-jailbreaks-research/web run build
      - name: Check AI engineering interview guide
        run: |
          node --check projects/004-ai-engineering-interview-guide/web/app.js
          npm --prefix projects/004-ai-engineering-interview-guide/web run build
      - name: Check system design notes guide
        run: |
          node --check projects/007-system-design-notes/web/app.js
          node projects/007-system-design-notes/web/build.mjs
      - name: Check coastal research and algorithm guide
        run: |
          node --check projects/008-coastal-simulation/web/app.js
          node --check projects/009-shorebreak/web/app.js
          node --check projects/010-algorithm-scene-lab/web/app.mjs
          node --check projects/010-algorithm-scene-lab/web/summary.js
          node --test projects/010-algorithm-scene-lab/web/model.test.mjs
          python3 projects/008-coastal-simulation/web/build.py
          python3 projects/009-shorebreak/web/build.py
          python3 projects/010-algorithm-scene-lab/web/build.py
      - name: Check GPU coastal simulation guide
        run: |
          node --check projects/012-coastal-simulation-cuda-webshader/web/app.mjs
          node --check projects/012-coastal-simulation-cuda-webshader/web/extensions.mjs
          node --check projects/012-coastal-simulation-cuda-webshader/web/source-view.mjs
          node --check projects/012-coastal-simulation-cuda-webshader/web/upstream/src/main.js
          node --check projects/012-coastal-simulation-cuda-webshader/web/upstream/src/resident-coast.js
          node --check projects/012-coastal-simulation-cuda-webshader/web/upstream/src/local-extension.js
          node --test projects/012-coastal-simulation-cuda-webshader/web/extensions-core.test.mjs
          python3 projects/012-coastal-simulation-cuda-webshader/web/build.py
