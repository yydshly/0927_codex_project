name: Deploy research demos

on:
  push:
    branches: [main]
    paths:
      - 'projects/003-lofi-cities/**'
      - 'scripts/build_site.py'
      - 'scripts/projects.py'
      - 'docs/site-projects.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check metadata and product
        run: |
          python3 scripts/projects.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          npm --prefix projects/003-lofi-cities/web run check
          npm --prefix projects/003-lofi-cities/web test
      - uses: actions/configure-pages@v5
      - name: Build every published demo and the shared index
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
