name: Deploy research demos

on:
  push:
    branches: [main]
    paths:
      - 'projects/001-xian-night-atlas/**'
      - 'projects/002-freemocap-lab/**'
      - 'projects/003-lofi-cities/**'
      - 'projects/004-ai-engineering-interview-guide/**'
      - 'projects/005-jailbreaks-research/**'
      - 'projects/006-threejs-gpu-rasterizer/**'
      - 'projects/007-system-design-notes/**'
      - 'projects/008-coastal-simulation/**'
      - 'projects/009-shorebreak/**'
      - 'projects/010-algorithm-scene-lab/**'
      - 'projects/011-cuda-webshader/**'
      - 'projects/012-coastal-simulation-cuda-webshader/**'
      - 'projects/013-scrolltide-motion-lab/**'
      - 'scripts/build_site.py'
      - 'scripts/projects.py'
      - 'docs/site-projects.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check metadata and product
        run: |
          python3 scripts/projects.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          npm --prefix projects/001-xian-night-atlas/web ci
          npm --prefix projects/001-xian-night-atlas/web test
          node --check projects/002-freemocap-lab/web/src/app.mjs
          npm --prefix projects/002-freemocap-lab/web test
          npm --prefix projects/003-lofi-cities/web run check
          npm --prefix projects/003-lofi-cities/web test
          npm --prefix projects/004-ai-engineering-interview-guide/web run build
          npm --prefix projects/005-jailbreaks-research/web run check
          npm --prefix projects/006-threejs-gpu-rasterizer/web ci
          npm --prefix projects/006-threejs-gpu-rasterizer/web run check
          node --check projects/007-system-design-notes/web/app.js
          node projects/007-system-design-notes/web/build.mjs
          node --check projects/008-coastal-simulation/web/app.js
          node --check projects/009-shorebreak/web/app.js
          node --check projects/010-algorithm-scene-lab/web/app.mjs
          node --check projects/010-algorithm-scene-lab/web/render.mjs
          node --check projects/010-algorithm-scene-lab/web/summary.js
          node --test projects/010-algorithm-scene-lab/web/model.test.mjs
          node --check projects/011-cuda-webshader/web/app.mjs
          node --check projects/011-cuda-webshader/web/prototypes.mjs
          node --check projects/011-cuda-webshader/web/prototypes-extra.mjs
          node --check projects/011-cuda-webshader/web/coastal-scene.mjs
          python3 projects/011-cuda-webshader/web/build.py
          node --check projects/012-coastal-simulation-cuda-webshader/web/app.mjs
          node --check projects/012-coastal-simulation-cuda-webshader/web/extensions.mjs
          node --check projects/012-coastal-simulation-cuda-webshader/web/source-view.mjs
          node --check projects/012-coastal-simulation-cuda-webshader/web/upstream/src/main.js
          node --check projects/012-coastal-simulation-cuda-webshader/web/upstream/src/resident-coast.js
          node --check projects/012-coastal-simulation-cuda-webshader/web/upstream/src/local-extension.js
          node --test projects/012-coastal-simulation-cuda-webshader/web/extensions-core.test.mjs
          python3 projects/012-coastal-simulation-cuda-webshader/web/build.py
          node --check projects/013-scrolltide-motion-lab/web/app.mjs
          python3 projects/013-scrolltide-motion-lab/web/build.py
      - uses: actions/configure-pages@v5
      - name: Build every published demo and the shared index
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
